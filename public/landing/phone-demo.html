<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ЗАМЕРX — пример комплектации</title>
  <link rel="stylesheet" href="/landing/phone-demo.css">
  <script type="module" src="/landing/phone-demo.js"></script>
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="p-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="p-reset" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 .7 7M4 4v6h6"/></symbol>
    <symbol id="p-layers" viewBox="0 0 24 24"><path d="m3 7 9-4 9 4-9 4zm0 5 9 4 9-4M3 17l9 4 9-4"/></symbol>
    <symbol id="p-file" viewBox="0 0 24 24"><path d="M14 2H5v20h14V7zm0 0v5h5M8 12h8m-8 4h8"/></symbol>
    <symbol id="p-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="p-light" viewBox="0 0 24 24"><path d="M8 14a6 6 0 1 1 8 0l-1 3H9zm1 7h6"/></symbol>
  </defs></svg>
  <header class="phone-header">
    <div class="phone-heading"><img src="/landing/favicon.svg" width="28" height="28" alt=""><div><span>ЗАМЕРX</span><h1>Гостиная</h1></div><button id="phone-reset" class="reset-button" type="button" aria-label="Сбросить пример"><svg class="icon" aria-hidden="true"><use href="#p-reset"/></svg></button></div>
    <div class="room-facts"><span>24 м²</span><span>20 м</span><span>6 углов</span><small>Из чертежа</small></div>
  </header>
  <p id="phone-status" class="phone-status" role="status" aria-live="polite" aria-atomic="true">Пример настроенных пресетов</p>
  <main id="phone-scroll" class="phone-scroll">
    <section id="phone-calculation" class="phone-pane" role="tabpanel" aria-labelledby="phone-tab-calculation"><h2 class="pane-heading">Комплектация</h2><div id="phone-blocks" class="phone-blocks"></div><p class="phone-example-note">Здесь показан пример. Свои блоки и пресеты вы настраиваете в приложении.</p></section>
    <section id="phone-estimate" class="phone-pane" role="tabpanel" aria-labelledby="phone-tab-estimate" hidden>
      <h2 class="pane-heading">Смета по группам</h2>
      <details id="phone-adjustments" class="phone-adjustments" hidden>
        <summary>Скидки и наценки <span aria-hidden="true">%</span></summary>
        <div class="adjustment-fields">
          <p id="phone-adjustment-hint">Минус — скидка, плюс — наценка.<br>Для каждой группы — свой процент.</p>
          <div class="adjustment-field"><label for="phone-adjustment-materials">Материалы</label><div class="adjustment-controls"><button class="adjustment-sign" type="button" data-adjustment-sign="materials" aria-label="Сменить знак процента: материалы">±</button><span class="adjustment-input"><input id="phone-adjustment-materials" type="text" inputmode="decimal" value="0" aria-describedby="phone-adjustment-hint" aria-label="Материалы: скидка или наценка, процентов" data-adjustment-group="materials"><span aria-hidden="true">%</span></span></div></div>
          <div class="adjustment-field"><label for="phone-adjustment-works">Работы</label><div class="adjustment-controls"><button class="adjustment-sign" type="button" data-adjustment-sign="works" aria-label="Сменить знак процента: работы">±</button><span class="adjustment-input"><input id="phone-adjustment-works" type="text" inputmode="decimal" value="0" aria-describedby="phone-adjustment-hint" aria-label="Работы: скидка или наценка, процентов" data-adjustment-group="works"><span aria-hidden="true">%</span></span></div></div>
          <div class="adjustment-field"><label for="phone-adjustment-equipment">Оборудование</label><div class="adjustment-controls"><button class="adjustment-sign" type="button" data-adjustment-sign="equipment" aria-label="Сменить знак процента: оборудование">±</button><span class="adjustment-input"><input id="phone-adjustment-equipment" type="text" inputmode="decimal" value="0" aria-describedby="phone-adjustment-hint" aria-label="Оборудование: скидка или наценка, процентов" data-adjustment-group="equipment"><span aria-hidden="true">%</span></span></div></div>
        </div>
      </details>
      <div id="phone-quote"></div>
    </section>
    <noscript><p class="no-script">Включите JavaScript, чтобы попробовать пример.</p></noscript>
  </main>
  <footer class="phone-footer">
    <div class="footer-total"><div><span>Итого</span><small>Цены условные</small></div><strong id="phone-total"><span id="phone-total-accessible" class="total-accessible">0 ₽</span><span id="phone-total-display" aria-hidden="true">0 ₽</span></strong></div>
    <nav class="phone-tabs" role="tablist" aria-label="Пример расчёта">
      <button id="phone-tab-calculation" type="button" role="tab" aria-selected="true" aria-controls="phone-calculation" data-phone-tab="calculation"><svg class="icon" aria-hidden="true"><use href="#p-layers"/></svg><span>Расчёт</span></button>
      <button id="phone-tab-estimate" type="button" role="tab" aria-selected="false" aria-controls="phone-estimate" tabindex="-1" data-phone-tab="estimate"><svg class="icon" aria-hidden="true"><use href="#p-file"/></svg><span>Смета</span><b id="phone-quote-badge" class="quote-badge" aria-hidden="true">0</b></button>
    </nav>
  </footer>
</body>
</html>
